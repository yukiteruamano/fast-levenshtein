name: release

on:
  push:
    tags:
      - 'v*.*.*'       # alias humano v2026.08.24
      - 'v2.*.*'       # canónico v2.20260824.0
      - 'v*.*.*.*'     # alias con sufijo v2026.08.24.1
      - 'v2.*.*.*'     # canónico con sufijo v2.20260824.1 (no usado, pero cubierto)
  workflow_dispatch:
    inputs:
      version:
        description: 'CalVer a publicar (ej. 2026.08.24 o 20260824.0). Se creará v2.YYYYMMDD.N'
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: publish to pkg.go.dev
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - name: Resolve TAG
        id: tag
        run: |
          set -e
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ inputs.version }}"
            # Normaliza: quita 'v' inicial si viene, permite 2026.08.24 o 20260824.0
            V="${V#v}"
            V="${V#v2.}"
            # Si viene con puntos YYYY.MM.DD -> convierte a YYYYMMDD.0
            if echo "$V" | grep -Eq '^[0-9]{4}\.[0-9]{2}\.[0-9]{2}$'; then
              V="$(echo "$V" | tr -d '.').0"
            elif echo "$V" | grep -Eq '^[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[0-9]+$'; then
              # 2026.08.24.1 -> 20260824.1
              V="$(echo "$V" | sed -E 's/^([0-9]{4})\.([0-9]{2})\.([0-9]{2})\.([0-9]+)$/\1\2\3.\4/')"
            fi
            TAG="v2.${V}"
            echo "Manual dispatch -> TAG=$TAG (from input $V)"
          else
            TAG="${GITHUB_REF#refs/tags/}"
            echo "Push tag -> TAG=$TAG"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "module=github.com/yukiteruamano/fast-levenshtein/v2" >> "$GITHUB_OUTPUT"
          # Verifica semver (vMAJOR.MINOR.PATCH)
          if ! echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(\.[0-9A-Za-z.-]*)?$'; then
            echo "::warning::Tag $TAG no parece semver válido, proxy puede rechazarlo"
          fi
          # Aviso si es alias v2026.08.24 sin v2. -> proxy lo tratará como pseudo-versión
          if echo "$TAG" | grep -Eq '^v[0-9]{4}\.[0-9]{2}\.[0-9]{2}'; then
            echo "::notice::Tag $TAG es alias humano; el canónico para pkg.go.dev es v2.$(echo "$TAG" | tr -d 'v.').0"
          fi

      - name: Validate (vet + race)
        run: |
          go vet ./...
          go test -race -count=1 ./...

      - name: Publish to proxy.golang.org
        run: |
          set -e
          TAG="${{ steps.tag.outputs.tag }}"
          MODULE="${{ steps.tag.outputs.module }}"
          echo "→ GOPROXY=proxy.golang.org go list -m ${MODULE}@${TAG}"
          GOPROXY=proxy.golang.org go list -m "${MODULE}@${TAG}"
          echo ""
          echo "→ Verificando https://proxy.golang.org/${MODULE}/@v/${TAG}.info"
          for i in 1 2 3 4 5; do
            if curl -fsSL "https://proxy.golang.org/${MODULE}/@v/${TAG}.info" | head -c 800; then
              echo ""
              echo "✓ proxy OK (intento $i)"
              break
            fi
            echo "  proxy aún no indexado, reintentando en 10s (intento $i/5)..."
            sleep 10
          done

      - name: Summary
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          MODULE="${{ steps.tag.outputs.module }}"
          echo "### ✅ Publicado ${TAG}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Módulo: \`${MODULE}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tag: \`${TAG}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- pkg.go.dev: https://pkg.go.dev/${MODULE}@${TAG}" >> "$GITHUB_STEP_SUMMARY"
          echo "- proxy info: https://proxy.golang.org/${MODULE}/@v/${TAG}.info" >> "$GITHUB_STEP_SUMMARY"
          echo "- proxy list: https://proxy.golang.org/${MODULE}/@v/list" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo 'Verifica con:' >> "$GITHUB_STEP_SUMMARY"
          echo '```bash' >> "$GITHUB_STEP_SUMMARY"
          echo "GOPROXY=proxy.golang.org go list -m ${MODULE}@${TAG}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
